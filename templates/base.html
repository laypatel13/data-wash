<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="theme-color" content="#161616"/>
  <link href="https://fonts.googleapis.com/css2?family=Balthazar&display=swap" rel="stylesheet"/>
  <title>{% block title %}DataWash{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"/>
</head>
<body>

<nav class="navbar d-flex justify-content-between align-items-center">
  <a class="navbar-brand" href="/">DataWash</a>
  <span class="text-muted">Clean · Analyze · Download</span>
</nav>

<div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
          {{ message }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<footer class="text-center py-4">
  Built by <a href="https://github.com/laypatel13" target="_blank">Lay Patel</a>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>

<!-- Global spinner -->
<div id="dw-spinner" style="
  display: none;
  opacity: 0;
  position: fixed;
  inset: 0;
  background: rgba(17,17,17,0.7);
  z-index: 9999;
  align-items: center;
  justify-content: center;
">
  <div style="text-align:center;">
    <div class="spinner-border text-light" role="status" style="width:28px; height:28px; border-width:2px;"></div>
    <div style="font-family: Copperplate, serif; font-size:11px; color:#666; margin-top:12px; letter-spacing:1px;">LOADING</div>
  </div>
</div>

</html>
